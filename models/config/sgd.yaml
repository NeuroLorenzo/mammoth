
default:
  optimizer: sgd
  lr: 0.1
  batch_size: 128
  n_epochs: 50            # epoche per task
  optim_mom: 0.9
  optim_wd: 5e-4
  optim_nesterov: False
  seed: 42
  validation: 0.1           # frazione val set (0 = usa test)
  nowand: 1             # 1 = disabilita Weights & Biases
  # csv_log: True          # salva risultati in CSV
  # verbose: True
  output_dir: "outputs"
  distributed: "no"
  dataset_config: default
