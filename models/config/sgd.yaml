
default:
  optimizer: adam
  lr: 0.001
  batch_size: 128
  n_epochs: 50            # epoche per task
  # optim_mom: 0.9
  # optim_wd: 5e-4
  # optim_nesterov: False
  seed: 42
  validation: 0.1           # frazione val set (0 = usa test)
  nowand: 1             # 1 = disabilita Weights & Biases
  # csv_log: True          # salva risultati in CSV
  # verbose: True
  output_dir: "outputs"
  distributed: "no"
  dataset_config: default

  trasform: None
  # Continual learning From NEST
  alpha: 0.1
  lr: 0.001
  # n_epochs: 30
  n_epochs: 1
  batch_size: 16

  # SRNN architecture
  n_in: 512
  srnn_hidden_size: 150
  # srnn_hidden_size: 300
  n_out: 10
  thr: .6
  tau_m: 30
  tau_o: 100
  b_o: 0.0
  dt: 1.
  n_t: 100
  seq_len_train: 100
  seq_len_test: 100
  keep_sparsity: False  
  syn_scale: False
  sparsity: [0.0,0.0,0.0]
  # sparsity: [0.75,0.99,0.0]
  #lr_layer: [0.005,0.005,0.005]
  lr_layer: [0.5,0.5,0.5] 
  f_target: 100
  
  c_reg: 0.001
  lr_win: 10
  classif: true
  gamma: 0.5
  e_lambda: 50
  weight_align: false
  use_buffer: false
  use_metapl: true
  use_ewc: false
  fr_reg: false
  filter_most_active: false
  n_active_filter: 1
  # xi: 0.01
  xi: 20
  meta_func: 'exp'
  logit_reg: false
  net_state: "./checkpoints/resnet18_scifar10_sgd_joint_inference.pt"